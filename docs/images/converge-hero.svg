    <linearGradient id="path"><stop stop-color="#80dbe0"/><stop offset=".5" stop-color="#a7aff0"/><stop offset="1" stop-color="#d0aae5"/></linearGradient>
    <linearGradient id="card" x2="1" y2="1"><stop stop-color="#202b40"/><stop offset="1" stop-color="#171d30"/></linearGradient>
