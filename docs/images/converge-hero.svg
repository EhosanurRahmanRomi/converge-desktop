<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="430" viewBox="0 0 1280 430" role="img" aria-labelledby="title desc">
  <title id="title">Converge — One boss. Two workers. A result you can inspect.</title>
  <desc id="desc">A restrained galaxy illustration connecting a boss to two workers, with a brief, work, review and download path. Decorative artwork, not a product screenshot.</desc>
