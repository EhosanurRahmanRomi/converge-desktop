name: Native macOS ARM64 release checks

on:
  push:
    branches: [macos-port]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: converge-macos-arm64-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-verify:
    runs-on: macos-15
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Require a native Apple Silicon host
        run: |
          test "$(uname -m)" = arm64
          node -e "require('node:assert/strict').equal(process.arch, 'arm64'); require('node:assert/strict').equal(process.platform, 'darwin')"
          mkdir -p .live-test
      - name: Install exact dependencies
        run: npm ci --no-audit --no-fund
      - name: Run the full source test suite
        # Native Mac visibility and focused editing share the WindowServer.
        # Run GUI fixtures serially so another test cannot occlude their window.
        run: npm test -- --test-concurrency=1 --test-reporter=tap 2>&1 | tee .live-test/macos-unit-tests.log
      - name: Build, ad-hoc sign and verify DMG and ZIP
        run: npm run build:mac
      - name: Run offline packaged integration checks
        env:
          CONVERGE_PACKAGED_ASAR: dist/mac-arm64/Converge.app/Contents/Resources/app.asar
        run: |
          node scripts/qa-packaged-desktop.js 2>&1 | tee .live-test/macos-packaged-qa.log
          node -e "const assert=require('node:assert/strict'),r=require('./desktop-cookie-packaged-qa-result.json'),p=require('./package.json'); assert.equal(r.passed,true); assert.equal(r.localFixturesOnly,true); assert.ok(r.tests.length>=24); assert.equal(r.packageVersion,p.version); assert.equal(r.launcherVersion,p.version); assert.equal(r.bootstrapVersion,p.version)"
      - name: Launch the actual packaged app and verify native editing and reopen
        run: node scripts/qa-native-macos-startup.js
      - name: Require a clean source tree after all build gates
        run: git diff --exit-code
      - name: Record verification scope
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'SUMMARY'
          ## Converge Apple Silicon verification
          Native ARM64 source tests, offline packaged integration tests, actual packaged startup, native editing, close/reopen, bundle permissions, framework links, source byte parity and ad-hoc signatures are required before artifacts are uploaded. The ZIP is extracted and the DMG mounted read-only for the same bundle checks.

          The release is **ad-hoc signed**, without Developer ID signing or Apple notarization. The host is a GitHub ARM64 runner. These checks do not claim a physical MacBook Air M4 test or authenticated live ChatGPT/file exchange.
          SUMMARY
      - name: Upload verified release files
        uses: actions/upload-artifact@v4
        with:
          name: Converge-macOS-arm64-release
          if-no-files-found: error
          compression-level: 0
          path: |
            dist/*-macOS-arm64.dmg
            dist/*-macOS-arm64.zip
            dist/SHA256SUMS-macOS.txt
            dist/macos-verification.json
      - name: Upload offline verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Converge-macOS-arm64-verification
          if-no-files-found: warn
          include-hidden-files: true
          path: |
            .live-test/macos-*.log
            .live-test/macos-native-startup.json
            .live-test/macos-native-startup.png
            desktop-cookie-packaged-qa-result.json
            desktop-cookie-qa-progress.json
            desktop-cookie-studio*.png
            desktop-cookie-layout*.png
